<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Respect Master logo</title>
  <desc id="desc">Dark circular logo with stylized SC monogram</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="50%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#02070d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0ef0ff"/>
      <stop offset="50%" stop-color="#4d79ff"/>
      <stop offset="100%" stop-color="#0a64ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="228" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.95"/>
  <circle cx="256" cy="256" r="217" fill="none" stroke="#163c75" stroke-width="8" opacity="0.7"/>

  <g filter="url(#shadow)">
    <text x="256" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="210" font-weight="900" letter-spacing="-20" fill="#edf7ff">SC</text>
  </g>

  <path d="M143 156c40-38 102-54 168-45" fill="none" stroke="#49caff" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M370 352c-44 41-106 59-175 50" fill="none" stroke="#49caff" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
</svg>
